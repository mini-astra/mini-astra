apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mini-astra
  namespace: argocd
spec:
  description: "Mini Astra Platform - Zero-Ops GitOps Cluster"
  sourceRepos:
  - '*'
  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
